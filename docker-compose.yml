version: "3.8"

services:
  mermicorn-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MERMICORN_SECRET=${MERMICORN_SECRET:-change-me-in-production}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

