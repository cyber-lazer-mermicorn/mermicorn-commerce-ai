[build]
  builder = "nixpacks"

[env]
  PYTHON_VERSION = "3.11"
  MERMICORN_SECRET = "${MERMICORN_SECRET}"

[deploy]
  startCommand = "uvicorn api:app --host 0.0.0.0 --port $PORT"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3
