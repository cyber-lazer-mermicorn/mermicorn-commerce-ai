app = 'mermicorn-api'

[build]
  builder = "python"

[env]
  PYTHON_VERSION = "3.11"
  MERMICORN_SECRET = "${MERMICORN_SECRET}"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = 30000
    timeout = 5000
    grace_period = 5000
    method = "GET"
    path = "/health"

[[services.scaling]]
  min = 1
  max = 3
